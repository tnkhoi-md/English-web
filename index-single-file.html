<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f4">
<meta name="description" content="Tnkhoi English: hệ thống tự học tiếng Anh thông dụng và tiếng Anh y khoa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tnkhoi English">
<title>Tnkhoi English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Charis+SIL:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Tnkhoi English · design tokens
   Nền xám lạnh, hai màu mạch học (General = cobalt, Medical = xanh lâm sàng),
   bút dạ quang cho trọng âm. UI: Be Vietnam Pro. Tiếng Anh + IPA: Charis SIL. */
:root {
  --paper: #eef1f4; --surface: #ffffff; --sunk: #e4e8ed; --ink: #17202d; --muted: #586273; --rule: #d6dce4;
  --gen: #3158d4; --gen-soft: #e3e9fb; --med: #0a8f78; --med-soft: #dcf1ea;
  --mark: #ffe06b; --bad: #b8372d; --bad-soft: #fbe6e3; --good: #1b7a45; --good-soft: #e0f3e7;
  --accent: var(--gen); --accent-soft: var(--gen-soft);
  --ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --en: "Charis SIL", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131a; --surface: #161d27; --sunk: #1d2531; --ink: #e6eaf0; --muted: #9aa4b3; --rule: #293344;
    --gen: #8ea6ff; --gen-soft: #1e2a4a; --med: #45c7a2; --med-soft: #133a31;
    --mark: rgba(255, 208, 70, .34); --bad: #ff8577; --bad-soft: #3d1f1c; --good: #62d08f; --good-soft: #173526;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131a; --surface: #161d27; --sunk: #1d2531; --ink: #e6eaf0; --muted: #9aa4b3; --rule: #293344;
  --gen: #8ea6ff; --gen-soft: #1e2a4a; --med: #45c7a2; --med-soft: #133a31;
  --mark: rgba(255, 208, 70, .34); --bad: #ff8577; --bad-soft: #3d1f1c; --good: #62d08f; --good-soft: #173526;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
img, svg { max-width: 100%; }
[tabindex="-1"]:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[lang="en"].en, .en { font-family: var(--en); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.track-gen { --accent: var(--gen); --accent-soft: var(--gen-soft); }
.track-med { --accent: var(--med); --accent-soft: var(--med-soft); }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px 18px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; color: inherit; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 700 17px/1 var(--en); letter-spacing: -.02em; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.nav-group { font-size: 12px; color: var(--muted); padding: 14px 10px 4px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 500; font-size: 15px; }
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; }
.side-foot { margin-top: auto; padding: 16px 10px 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.main { min-width: 0; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 28px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.timer-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); font-size: 14px; font-variant-numeric: tabular-nums; }
.timer-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.timer-pill.on i { background: var(--good); }
.page { max-width: 900px; padding: 8px 28px 96px; }
.bottom { display: none; }

/* ---------- Type ---------- */
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.015em; }
h1 { font-size: 34px; font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
.lede { font-size: 18px; color: var(--muted); max-width: 60ch; }
.page-head { display: grid; gap: 8px; margin: 18px 0 26px; }
.stack { display: grid; gap: 14px; }
.stack-lg { display: grid; gap: 28px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* ---------- Surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 22px; }
.panel.tight { padding: 16px; }
.panel.accent { border-left: 4px solid var(--accent); }
.soft { background: var(--accent-soft); border-radius: var(--r-md); padding: 14px 16px; }
.divider { height: 1px; background: var(--rule); margin: 4px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--sunk); color: var(--muted); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.stat b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: var(--r-md); border: 1px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 15px; text-decoration: none; color: inherit; transition: transform .08s ease; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0e131a; } }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.quiet { border-color: transparent; background: transparent; padding-inline: 10px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); display: inline-grid; place-items: center; font-size: 18px; }

/* ---------- Word specimen (the memorable element) ---------- */
.specimen { display: grid; gap: 6px; }
.spec-word { font: 400 clamp(40px, 7vw, 64px)/1.05 var(--en); letter-spacing: -.01em; display: flex; flex-wrap: wrap; align-items: baseline; }
.spec-word .syl { position: relative; }
.spec-word .dot { color: var(--muted); opacity: .45; padding: 0 .06em; font-size: .6em; transform: translateY(-.35em); }
.spec-word .stress { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 .04em; }
.spec-word.sm { font-size: clamp(30px, 5vw, 40px); }
.ipa { font: 400 20px/1.3 var(--en); color: var(--muted); }
.pos { font-size: 14px; color: var(--muted); font-style: italic; font-family: var(--en); }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.part { display: grid; justify-items: center; padding: 6px 10px 5px; border-radius: 10px; border: 1px dashed var(--accent); min-width: 54px; }
.part b { font: 700 18px/1.1 var(--en); color: var(--accent); }
.part span { font-size: 12px; color: var(--muted); }
.example { font: 400 20px/1.5 var(--en); }
.example-vi { color: var(--muted); font-size: 15px; }
.tip { font-size: 15px; padding: 10px 14px; border-radius: var(--r-md); background: var(--sunk); }
.tip b { font-weight: 600; }

/* ---------- Lists ---------- */
.list { display: grid; gap: 0; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--rule); color: inherit; text-decoration: none; }
.item:first-child { border-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; }
.item .s { font-size: 14px; color: var(--muted); }
.item.link:hover .t { color: var(--accent); }
.lesson-dot { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 2px solid var(--accent); color: var(--accent); }
.lesson-dot.done { background: var(--accent); color: var(--surface); }
.lesson-dot.lock { border-color: var(--rule); color: var(--muted); }

/* ---------- Plan (Today) ---------- */
.plan { counter-reset: plan; display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.plan-step { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--rule); }
.plan-step::before { counter-increment: plan; content: counter(plan); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.plan-step .why { font-size: 14px; color: var(--muted); }
.goal-bar { height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--good); border-radius: inherit; }

/* ---------- Focus mode (lesson / review / clinic) ---------- */
body.focus .shell { grid-template-columns: 1fr; }
body.focus .side, body.focus .bottom { display: none !important; }
.focus-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.progress { flex: 1; display: flex; gap: 4px; }
.progress i { flex: 1; height: 6px; border-radius: 999px; background: var(--rule); }
.progress i.on { background: var(--accent); }
.progress i.cur { background: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.focus-page { max-width: 760px; margin: 0 auto; padding: 12px 20px 120px; }
.step-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 22px; padding: 28px; display: grid; gap: 18px; }
.step-kind { font-size: 14px; color: var(--accent); font-weight: 600; }
.step-actions { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.step-actions .btn { box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 14%, transparent); }

/* ---------- Exercises ---------- */
.choices { display: grid; gap: 10px; }
.choice { text-align: left; padding: 14px 16px; min-height: 52px; border-radius: var(--r-md); border: 1.5px solid var(--rule); background: var(--surface); font-size: 17px; font-family: var(--en); line-height: 1.4; }
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); }
.choice[disabled] { cursor: default; }
.feedback { padding: 12px 14px; border-radius: var(--r-md); font-size: 15px; }
.feedback.ok { background: var(--good-soft); color: var(--ink); }
.feedback.no { background: var(--bad-soft); color: var(--ink); }
.feedback b { font-weight: 700; }
.q { font-size: 18px; font-weight: 600; font-family: var(--en); }
.cloze { font: 400 26px/1.5 var(--en); }
.cloze .gap { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); }
.field { width: 100%; padding: 14px 16px; border-radius: var(--r-md); border: 1.5px solid var(--rule); background: var(--paper); font: 400 20px/1.4 var(--en); }
.field:focus { outline: none; border-color: var(--accent); }
textarea.field { min-height: 120px; resize: vertical; font-size: 18px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 8px; border-radius: var(--r-md); }
.tiles.answer { background: var(--paper); border: 1.5px dashed var(--rule); }
.tile { padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--surface); font: 400 19px/1 var(--en); }
.tile.used { visibility: hidden; }
.diff { font: 400 20px/1.8 var(--en); }
.diff .ok { color: var(--good); }
.diff .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }
.diff .extra { color: var(--muted); text-decoration: line-through; }
.classify { display: grid; gap: 10px; }
.cls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.cls-row:first-child { border-top: 0; }
.cls-row .en { flex: 1 1 200px; font-size: 19px; }
.seg { display: inline-flex; border: 1.5px solid var(--rule); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; min-width: 52px; min-height: 40px; font-size: 15px; border-left: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button.pick { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button.right { background: var(--good-soft); color: var(--good); font-weight: 700; }
.seg button.wrong { background: var(--bad-soft); color: var(--bad); }
.pitfall { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 16px; padding: 12px 0; border-top: 1px solid var(--rule); }
.pitfall:first-child { border-top: 0; }
.pitfall .x { color: var(--bad); font-family: var(--en); text-decoration: line-through; }
.pitfall .v { color: var(--good); font-family: var(--en); font-weight: 700; }
.pitfall .why { grid-column: 2; font-size: 14px; color: var(--muted); }
.mark-x, .mark-v { font-weight: 700; width: 18px; text-align: center; }
.mark-x { color: var(--bad); } .mark-v { color: var(--good); }
.ex-list { display: grid; gap: 10px; }
.ex-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.ex-item .en { font-size: 19px; }
.ex-item .vi { grid-column: 1; font-size: 14px; color: var(--muted); }
.ex-item .icon-btn { grid-row: 1 / span 2; grid-column: 2; }
.dialogue { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: start; }
.line .who { font-size: 13px; font-weight: 600; color: var(--muted); padding-top: 4px; }
.line .en { font-size: 18px; }
.line .vi { font-size: 14px; color: var(--muted); }
.line.speaking .en { background: linear-gradient(transparent 60%, var(--mark) 60%); }
.checklist { display: flex; flex-wrap: wrap; gap: 8px; }
.rec-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- Review card ---------- */
.flash { min-height: 320px; display: grid; align-content: center; gap: 14px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; border-radius: var(--r-md); border: 1.5px solid var(--rule); background: var(--surface); font-weight: 600; }
.grade small { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grade.g1 { color: var(--bad); } .grade.g4 { color: var(--good); }
.grade.suggest { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- Clinic ---------- */
.clinic { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.role-card { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; }
.avatar { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--med-soft); color: var(--med); font-weight: 700; font-size: 18px; }
.chat { display: grid; gap: 10px; max-height: 58vh; overflow-y: auto; padding: 4px 2px; scroll-behavior: smooth; }
.bubble { max-width: 88%; padding: 10px 14px; border-radius: 16px; font: 400 17px/1.45 var(--en); }
.bubble.dr { justify-self: end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
:root[data-theme="dark"] .bubble.dr { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bubble.dr { color: #0e131a; } }
.bubble.pt { justify-self: start; background: var(--sunk); border-bottom-left-radius: 4px; }
.bubble.tip { justify-self: center; max-width: 100%; background: var(--sunk); color: var(--muted); font: 400 14px/1.45 var(--ui); border-radius: 12px; }
.bubble.note { justify-self: center; max-width: 100%; background: var(--bad-soft); font: 400 14px/1.45 var(--ui); border-radius: 12px; }
.bank { display: grid; gap: 4px; max-height: 70vh; overflow-y: auto; }
.bank details { border-top: 1px solid var(--rule); }
.bank details:first-child { border-top: 0; }
.bank summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 4px; font-weight: 600; font-size: 15px; cursor: pointer; }
.bank summary::-webkit-details-marker { display: none; }
.bank .qbtn { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); font: 400 16px/1.4 var(--en); }
.bank .qbtn.asked { opacity: .5; }
.cov { font-size: 12px; font-weight: 600; color: var(--muted); }
.cov.full { color: var(--good); }
.ask-box { display: flex; gap: 8px; }
.ask-box .field { font-size: 17px; padding: 10px 14px; }

.bank-group { padding: 6px 0 4px; border-top: 1px solid var(--rule); }
.bank-group:first-child { border-top: 0; }
.bank-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 2px; font-weight: 600; font-size: 14px; }
.hero-plan { font-size: clamp(30px, 4.6vw, 46px); line-height: 1.12; letter-spacing: -.025em; max-width: 22ch; }

/* ---------- Progress ---------- */
.skill { display: grid; grid-template-columns: 150px 1fr 88px; gap: 12px; align-items: center; padding: 8px 0; }
.skill .bar { height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.skill .bar i { display: block; height: 100%; background: var(--ink); border-radius: inherit; }
.skill .n { text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 14px; height: 14px; border-radius: 4px; background: var(--sunk); }
.heat i.l1 { background: color-mix(in srgb, var(--good) 30%, var(--sunk)); }
.heat i.l2 { background: color-mix(in srgb, var(--good) 55%, var(--sunk)); }
.heat i.l3 { background: color-mix(in srgb, var(--good) 80%, var(--sunk)); }
.heat i.l4 { background: var(--good); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.bars div { flex: 1; display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; }
.bars i { width: 100%; max-width: 28px; border-radius: 6px 6px 2px 2px; background: var(--ink); min-height: 2px; }

  quiz: [["She is ___ engineer.", ["a", "an", "the"], 1, "engineer bắt đầu bằng âm nguyên âm."], ["___ exercise is good for you.", ["The", "An", "(không mạo từ)"], 2, "Nói chung chung về tập thể dục: không mạo từ."]] },
{ id: "there-is", lvl: "A1", title: "There is / there are", vi: "Có (tồn tại)", exams: ["CEFR", "VSTEP"],
  form: "There is + số ít / không đếm được. There are + số nhiều. Is there …? Are there any …?",
  use: "Nói một thứ tồn tại ở đâu đó. Không dịch “có” thành have.",
  ex: [["There is a pharmacy near here.", "Gần đây có một hiệu thuốc."], ["There are two lifts.", "Có hai thang máy."]],
  err: [["Have a pharmacy near here?", "Is there a pharmacy near here?", "Dịch từng chữ từ “có”."], ["There is many people.", "There are many people.", "Số nhiều dùng are."]],
  quiz: [["___ any toilets on this floor?", ["Is there", "Are there", "Have"], 1, "toilets số nhiều: Are there."]] },
{ id: "questions", lvl: "A1", title: "Question word order", vi: "Trật tự từ trong câu hỏi", exams: ["CEFR", "VSTEP", "IELTS"],
  form: "(Từ để hỏi) + trợ động từ + chủ ngữ + động từ chính. Where do you live? What does it feel like? When did it start?",
  use: "Tiếng Việt giữ nguyên trật tự câu và thêm từ hỏi. Tiếng Anh phải đảo trợ động từ lên trước chủ ngữ.",
  ex: [["Where does it hurt?", "Đau ở đâu?"], ["How long have you had it?", "Bạn bị bao lâu rồi?"]],
  err: [["Where you feel the pain?", "Where do you feel the pain?", "Thiếu trợ động từ do."], ["When it started?", "When did it start?", "Quá khứ: did + động từ nguyên mẫu."]],
  quiz: [["Chọn câu đúng", ["What you are doing?", "What are you doing?", "What doing you?"], 1, "Đảo are lên trước you."], ["Chọn câu đúng", ["How often you exercise?", "How often do you exercise?", "How often exercise you?"], 1, "Cần trợ động từ do."]] },
{ id: "prepositions", lvl: "A1", title: "Prepositions of time & place", vi: "Giới từ chỉ thời gian và nơi chốn", exams: ["CEFR", "TOEIC", "VSTEP"],
  form: "at + giờ (at 7 pm), on + ngày (on Monday), in + tháng, năm, buổi (in May, in the morning). at + điểm (at the hospital), in + trong không gian (in the room), on + bề mặt, tầng (on the second floor).",
  use: "Giới từ hay đi kèm cố định: interested in, depend on, married to, good at, allergic to.",
  ex: [["The appointment is at 9 on Monday.", "Lịch hẹn lúc 9 giờ thứ Hai."], ["She's allergic to penicillin.", "Cô ấy dị ứng penicillin."]],
  err: [["in Monday", "on Monday", "Ngày trong tuần dùng on."], ["discuss about the plan", "discuss the plan", "discuss không cần about."], ["married with", "married to", "Cụm cố định."]],
  quiz: [["I was born ___ 2003.", ["on", "in", "at"], 1, "Năm dùng in."], ["The X-ray department is ___ the second floor.", ["in", "at", "on"], 2, "Tầng dùng on."]] },
{ id: "past-simple", lvl: "A2", title: "Past simple", vi: "Thì quá khứ đơn", exams: ["CEFR", "VSTEP", "TOEIC", "IELTS"],
  form: "V-ed hoặc động từ bất quy tắc (go → went). Phủ định: didn't + V. Câu hỏi: Did + S + V?",
  use: "Việc đã xong trong quá khứ, thường có thời gian cụ thể: yesterday, last week, two days ago. Có từ chỉ thời gian vẫn phải chia động từ.",
  ex: [["I went to the pharmacy yesterday.", "Hôm qua tôi đi hiệu thuốc."], ["Did you take the tablets?", "Bạn đã uống thuốc chưa?"]],
  err: [["Yesterday I go to work.", "Yesterday I went to work.", "Có yesterday vẫn phải chia quá khứ."], ["Did you went?", "Did you go?", "Sau did dùng nguyên mẫu."]],
  quiz: [["The pain ___ two days ago.", ["start", "started", "has started"], 1, "Mốc two days ago: quá khứ đơn."], ["I ___ breakfast this morning.", ["don't have", "didn't have", "didn't had"], 1, "didn't + nguyên mẫu."]] },
{ id: "future", lvl: "A2", title: "Will, going to, present continuous", vi: "Các cách nói về tương lai", exams: ["CEFR", "VSTEP", "TOEIC"],
  form: "will + V (quyết định lúc nói, dự đoán, lời hứa). be going to + V (dự định đã có, dự đoán có dấu hiệu). Hiện tại tiếp diễn (lịch hẹn đã sắp xếp).",
  use: "I'll call you back (vừa quyết định). I'm going to study medicine (dự định). I'm seeing the doctor at 3 (đã hẹn).",
  ex: [["I'll open the window.", "Để tôi mở cửa sổ."], ["We're meeting the client tomorrow.", "Mai chúng tôi gặp khách hàng."]],
  err: [["I will to go.", "I will go.", "Sau will không có to."], ["Tomorrow I go to Hanoi.", "Tomorrow I'm going to Hanoi.", "Kế hoạch tương lai cần dạng tương lai."]],
  quiz: [["Look at those clouds. It ___ rain.", ["is going to", "will to", "rains"], 0, "Có dấu hiệu hiện tại: going to."]] },
{ id: "comparatives", lvl: "A2", title: "Comparatives & superlatives", vi: "So sánh hơn và so sánh nhất", exams: ["CEFR", "TOEIC", "IELTS"],
  form: "Tính từ ngắn: -er than, the -est. Tính từ dài: more … than, the most. Bất quy tắc: good → better → best, bad → worse → worst.",
  use: "So sánh hai hay nhiều đối tượng. Trong IELTS Writing Task 1 dùng rất nhiều.",
  ex: [["The pain is worse at night.", "Cơn đau nặng hơn về đêm."], ["This is the most effective treatment.", "Đây là cách điều trị hiệu quả nhất."]],
  err: [["more better", "better", "Không dùng more với dạng -er."], ["more cheap than", "cheaper than", "Tính từ ngắn dùng -er."]],
  quiz: [["Today I feel ___ than yesterday.", ["good", "better", "more good"], 1, "good → better."]] },
{ id: "present-perfect", lvl: "A2", title: "Present perfect", vi: "Thì hiện tại hoàn thành", exams: ["CEFR", "VSTEP", "TOEIC", "IELTS"],
  form: "have/has + V3 (quá khứ phân từ). Hay đi với ever, never, just, already, yet, for, since.",
  use: "Trải nghiệm đến giờ, việc vừa xảy ra, việc kéo dài từ quá khứ tới hiện tại. How long have you had the cough?",
  ex: [["I've had this cough for two weeks.", "Tôi bị ho hai tuần rồi."], ["Have you ever had surgery?", "Bạn đã từng phẫu thuật chưa?"]],
  err: [["I live here since 2020.", "I have lived here since 2020.", "Kéo dài đến nay dùng hiện tại hoàn thành."], ["I have seen him yesterday.", "I saw him yesterday.", "Có mốc quá khứ cụ thể thì dùng quá khứ đơn."]],
  quiz: [["She ___ in this hospital since 2019.", ["works", "has worked", "worked"], 1, "since + mốc, kéo dài đến nay."], ["I ___ my keys. I can't find them.", ["lost", "have lost", "am losing"], 1, "Kết quả ở hiện tại: have lost."]] },
{ id: "modals", lvl: "A2", title: "Should, must, have to", vi: "Động từ khuyết thiếu chỉ lời khuyên, bắt buộc", exams: ["CEFR", "VSTEP", "TOEIC"],
  form: "should/must/can/might + V nguyên mẫu (không to, không -s). have to + V (có chia: she has to).",
  use: "should: lời khuyên. must: bắt buộc từ người nói. have to: bắt buộc từ quy định. mustn't: cấm. don't have to: không cần.",
  ex: [["You should rest for a few days.", "Bạn nên nghỉ ngơi vài ngày."], ["You mustn't drive after this medicine.", "Không được lái xe sau khi dùng thuốc này."]],
  err: [["You must to take it.", "You must take it.", "Không có to sau must."], ["She cans come.", "She can come.", "Động từ khuyết thiếu không thêm -s."]],
  quiz: [["You ___ drink alcohol with this medicine. It's dangerous.", ["mustn't", "don't have to", "should"], 0, "Cấm vì nguy hiểm: mustn't."], ["It's free. You ___ pay.", ["mustn't", "don't have to", "can't"], 1, "Không cần: don't have to."]] },
{ id: "first-conditional", lvl: "A2", title: "First conditional", vi: "Câu điều kiện loại 1", exams: ["CEFR", "VSTEP", "IELTS"],
  form: "If + hiện tại đơn, will + V. Mệnh đề if không dùng will.",
  use: "Điều có thể xảy ra trong hiện tại hoặc tương lai, dùng nhiều khi dặn dò bệnh nhân.",
  ex: [["If the pain gets worse, come back straight away.", "Nếu đau nặng hơn, hãy quay lại ngay."], ["If you take it with food, it will upset your stomach less.", "Nếu uống cùng thức ăn, thuốc sẽ ít làm khó chịu dạ dày hơn."]],
  err: [["If you will take it…", "If you take it…", "Không dùng will sau if."]],
  quiz: [["If it ___ tomorrow, we will stay at home.", ["will rain", "rains", "rained"], 1, "Mệnh đề if dùng hiện tại đơn."]] },
{ id: "gerund-infinitive", lvl: "B1", title: "Gerund or infinitive", vi: "V-ing hay to V", exams: ["TOEIC", "IELTS", "VSTEP"],
  form: "Sau enjoy, avoid, finish, stop, suggest, mind, keep: V-ing. Sau want, decide, plan, hope, agree, refuse, need: to V. Sau giới từ: luôn V-ing.",
  use: "Nhóm này rất hay xuất hiện trong TOEIC Part 5.",
  ex: [["Avoid lifting heavy things.", "Tránh nâng vật nặng."], ["I decided to study medicine.", "Tôi quyết định học y."], ["She's interested in learning English.", "Cô ấy thích học tiếng Anh."]],
  err: [["avoid to lift", "avoid lifting", "avoid + V-ing."], ["I'm interested in learn.", "I'm interested in learning.", "Sau giới từ dùng V-ing."]],
  quiz: [["You should stop ___.", ["smoke", "to smoke", "smoking"], 2, "stop + V-ing = bỏ thói quen."], ["We plan ___ a new clinic.", ["opening", "to open", "open"], 1, "plan + to V."]] },
{ id: "pp-vs-past", lvl: "B1", title: "Present perfect vs past simple, for / since", vi: "Hiện tại hoàn thành hay quá khứ đơn", exams: ["IELTS", "VSTEP", "TOEIC"],
  form: "Quá khứ đơn: thời điểm đã kết thúc (yesterday, in 2020, ago). Hiện tại hoàn thành: đến nay, không nói rõ lúc nào. for + khoảng thời gian; since + mốc.",
  use: "Trong hỏi bệnh: When did it start? (quá khứ đơn) và How long have you had it? (hiện tại hoàn thành).",
  ex: [["It started three days ago.", "Nó bắt đầu cách đây ba ngày."], ["I've had it for three days / since Monday.", "Tôi bị ba ngày rồi / từ thứ Hai."]],
  err: [["since three days", "for three days", "Khoảng thời gian dùng for."], ["How long do you have it?", "How long have you had it?", "“Bao lâu rồi” dùng hiện tại hoàn thành."]],
  quiz: [["I ___ him since we were students.", ["knew", "have known", "know"], 1, "since + mốc, kéo dài đến nay."], ["She ___ to Japan in 2022.", ["has gone", "went", "goes"], 1, "Năm cụ thể: quá khứ đơn."]] },
{ id: "passive", lvl: "B1", title: "The passive", vi: "Câu bị động", exams: ["TOEIC", "IELTS", "VSTEP"],
  form: "be (chia theo thì) + V3. The sample was sent. The results will be ready. The room is being cleaned. Người thực hiện (nếu cần): by …",
  use: "Khi hành động quan trọng hơn người làm: văn phong học thuật, báo cáo, quy trình y khoa.",
  ex: [["The patient was admitted last night.", "Bệnh nhân được nhập viện tối qua."], ["Blood samples are taken in the morning.", "Mẫu máu được lấy vào buổi sáng."]],
  err: [["The sample sent to the lab.", "The sample was sent to the lab.", "Bị động cần be."], ["The meeting was cancel.", "The meeting was cancelled.", "Sau be dùng V3."]],
  quiz: [["The new hospital ___ in 2025.", ["built", "was built", "is building"], 1, "Bệnh viện được xây: bị động quá khứ."], ["All applications must ___ by Friday.", ["submit", "be submitted", "submitted"], 1, "must + be + V3."]] },
{ id: "relative", lvl: "B1", title: "Relative clauses", vi: "Mệnh đề quan hệ", exams: ["IELTS", "TOEIC", "VSTEP"],
  form: "who (người), which (vật), that (người/vật, chỉ trong mệnh đề xác định), whose (của ai), where (nơi). Mệnh đề không xác định có dấu phẩy và không dùng that.",
  use: "Nối hai câu, mô tả chính xác người hoặc vật. Giúp câu văn IELTS phức tạp hơn.",
  ex: [["The doctor who saw me was very kind.", "Vị bác sĩ khám cho tôi rất tử tế."], ["My sister, who lives in Hue, is a nurse.", "Chị tôi, người sống ở Huế, là y tá."]],
  err: [["The drug that you take it…", "The drug that you take…", "Không lặp lại đại từ it."], ["My mother, that is a teacher…", "My mother, who is a teacher…", "Mệnh đề có dấu phẩy không dùng that."]],
  quiz: [["The man ___ car was stolen called the police.", ["who", "whose", "which"], 1, "Sở hữu: whose."], ["This is the clinic ___ I work.", ["where", "which", "who"], 0, "Nơi chốn: where."]] },
{ id: "sva", lvl: "B1", title: "Subject–verb agreement", vi: "Hòa hợp chủ ngữ và động từ", exams: ["TOEIC", "IELTS"],
  form: "Chủ ngữ số ít + động từ số ít. Everyone, each, the number of + số ít. A number of + số nhiều. Chủ ngữ dài: tìm danh từ chính.",
  use: "Lỗi rất hay bị bắt trong TOEIC Part 5 và bị trừ điểm IELTS Writing.",
  ex: [["The number of patients is increasing.", "Số bệnh nhân đang tăng."], ["The results of the test show …", "Kết quả xét nghiệm cho thấy …"]],
  err: [["The number of patients are rising.", "The number of patients is rising.", "Danh từ chính là number."], ["Everyone have a role.", "Everyone has a role.", "Everyone là số ít."]],
  quiz: [["Each of the rooms ___ a window.", ["have", "has", "having"], 1, "Each of … dùng số ít."], ["The list of names ___ on the desk.", ["is", "are", "be"], 0, "Danh từ chính là list."]] },
{ id: "reported", lvl: "B1", title: "Reported speech", vi: "Câu tường thuật", exams: ["VSTEP", "IELTS"],
  form: "Lùi thì: am → was, will → would, did → had done. say (that) …; tell + người + (that) …; ask + if/whether hoặc từ để hỏi + S + V.",
  use: "Thuật lại lời bệnh nhân, đồng nghiệp: She said she had a headache.",
  ex: [["She said (that) she felt dizzy.", "Cô ấy nói cô ấy thấy chóng mặt."], ["He asked where the pharmacy was.", "Anh ấy hỏi hiệu thuốc ở đâu."]],
  err: [["She said me …", "She told me … / She said to me …", "say không đi trực tiếp với người."], ["He asked where was the pharmacy.", "He asked where the pharmacy was.", "Câu hỏi gián tiếp không đảo ngữ."]],
  quiz: [["He ___ me that he was tired.", ["said", "told", "asked"], 1, "tell + người."]] },
{ id: "second-conditional", lvl: "B1", title: "Second conditional", vi: "Câu điều kiện loại 2", exams: ["IELTS", "VSTEP"],
  form: "If + quá khứ đơn, would + V. If I were you, I would … (dùng were cho mọi ngôi, trang trọng).",
  use: "Giả định không có thật ở hiện tại, lời khuyên lịch sự.",
  ex: [["If I had more time, I would study more.", "Nếu có nhiều thời gian hơn, tôi sẽ học nhiều hơn."], ["If I were you, I'd see a doctor.", "Nếu là bạn, tôi sẽ đi khám."]],
  err: [["If I would have time…", "If I had time…", "Không dùng would sau if."]],
  quiz: [["If she ___ closer, she would walk to work.", ["lives", "lived", "would live"], 1, "Điều kiện loại 2: quá khứ đơn sau if."]] },
{ id: "word-forms", lvl: "B1", title: "Word forms", vi: "Dạng từ: danh, động, tính, trạng từ", exams: ["TOEIC", "IELTS", "VSTEP"],
  form: "Vị trí quyết định dạng từ: sau mạo từ và tính từ là danh từ; trước danh từ là tính từ; bổ nghĩa cho động từ là trạng từ (-ly). Hậu tố: -tion, -ment, -ness (danh từ); -ful, -ive, -al (tính từ).",
  use: "Dạng câu hỏi xuất hiện nhiều nhất trong TOEIC Part 5.",
  ex: [["a successful launch", "một buổi ra mắt thành công"], ["She works efficiently.", "Cô ấy làm việc hiệu quả."], ["the decision of the committee", "quyết định của hội đồng"]],
  err: [["a success launch", "a successful launch", "Trước danh từ cần tính từ."], ["He speaks English very good.", "He speaks English very well.", "Bổ nghĩa cho động từ dùng trạng từ."]],
  quiz: [["The new system is very ___.", ["effect", "effective", "effectively"], 1, "Sau be và very cần tính từ."], ["Please read the instructions ___.", ["careful", "care", "carefully"], 2, "Bổ nghĩa cho read: trạng từ."]] },
{ id: "third-conditional", lvl: "B2", title: "Third conditional, wish", vi: "Câu điều kiện loại 3 và câu ước", exams: ["IELTS", "VSTEP"],
  form: "If + had V3, would have V3. I wish + quá khứ đơn (hiện tại), I wish + had V3 (quá khứ).",
  use: "Giả định trái với quá khứ, hối tiếc.",
  ex: [["If he had come earlier, we would have treated him sooner.", "Nếu anh ấy đến sớm hơn, chúng tôi đã điều trị sớm hơn."], ["I wish I had studied harder.", "Ước gì tôi đã học chăm hơn."]],
  err: [["If I would have known…", "If I had known…", "Mệnh đề if dùng had V3."]],
  quiz: [["If she ___ the bus, she wouldn't have been late.", ["caught", "had caught", "would catch"], 1, "Loại 3: had + V3."]] },
{ id: "modals-past", lvl: "B2", title: "Modals in the past", vi: "Động từ khuyết thiếu ở quá khứ", exams: ["IELTS"],
  form: "should have V3 (lẽ ra nên), must have V3 (chắc hẳn đã), might/could have V3 (có thể đã), can't have V3 (không thể nào đã).",
  use: "Suy đoán hoặc tiếc nuối về quá khứ.",
  ex: [["You should have come in earlier.", "Lẽ ra bạn nên đến khám sớm hơn."], ["It must have been a virus.", "Chắc hẳn đó là do vi-rút."]],
  err: [["You should came.", "You should have come.", "should + have + V3."]],
  quiz: [["The lights are off. They ___ gone home.", ["must have", "should have", "can have"], 0, "Suy đoán chắc chắn: must have."]] },
{ id: "linking", lvl: "B2", title: "Although, despite, however", vi: "Từ nối chỉ sự tương phản", exams: ["TOEIC", "IELTS", "VSTEP"],
  form: "although/even though + mệnh đề (S + V). despite/in spite of + danh từ hoặc V-ing. However, … đứng đầu câu mới, sau nó có dấu phẩy.",
  use: "TOEIC hay hỏi phân biệt although và despite. IELTS thưởng điểm cho câu phức có liên từ đúng.",
  ex: [["Although it was raining, she walked to work.", "Mặc dù trời mưa, cô ấy vẫn đi bộ đi làm."], ["Despite the rain, she walked to work.", "Bất chấp trời mưa, cô ấy vẫn đi bộ đi làm."]],
  err: [["Despite it was raining…", "Although it was raining… / Despite the rain…", "despite không đi với mệnh đề."], ["Although …, but …", "Although …, …", "Không dùng although và but cùng lúc."]],
  quiz: [["___ feeling tired, he finished the report.", ["Although", "Despite", "However"], 1, "Sau chỗ trống là V-ing: despite."], ["The drug works well. ___, it can cause headaches.", ["Although", "Despite", "However"], 2, "Đầu câu mới, có dấu phẩy: However."]] },
{ id: "indirect-questions", lvl: "B2", title: "Indirect questions", vi: "Câu hỏi gián tiếp (lịch sự)", exams: ["IELTS", "TOEIC"],
  form: "Could you tell me / Do you know / I was wondering + từ để hỏi (hoặc if/whether) + S + V (không đảo ngữ).",

let R = null;

  if (idx < 0 && R.queue.length) { const soon = R.queue.map((id, i) => [i, S.cards[id].due]).filter(x => x[1] - now < 20 * MIN).sort((a, b) => a[1] - b[1])[0]; idx = soon ? soon[0] : -1; }
  if (idx < 0) { R.cur = null; R.phase = "end"; return; }
  R.cur = R.queue.splice(idx, 1)[0]; R.phase = "front"; R.typed = ""; R.check = null;
}

function overlap(a, b) { const A = new Set(norm(a).split(" ").filter(w => !STOP.has(w))); return norm(b).split(" ").filter(w => !STOP.has(w) && A.has(w)).length; }

/* ---------------- Words ---------------- */
let B = null, WQ = "";

  return `<div class="list">${ws.map(({ w, l, i }) => { const [s, cls] = status(l, i); return `<div class="item track-${l.track}"><span class="grow"><span class="t en" lang="en" style="font-size:19px">${esc(w.w)}</span> <span class="muted" style="font-family:var(--en)">${esc(ipaOf(w))}</span><br><span class="s">${esc(w.vi)}, bài ${l.id}</span></span><span class="chip ${cls}">${s}</span>${hear(w.w)}</div>`; }).join("")}</div>`;
}
function viewWords() {

  let body = "";
  if (tab === "list") body = `<input class="search" id="wsearch" type="search" placeholder="Tìm từ hoặc nghĩa…" value="${esc(WQ)}" aria-label="Tìm từ"><div id="wlist" style="margin-top:14px">${wordListHtml()}</div>`;
  else if (tab === "anatomy") {
    const grp = (type, title) => `<section class="panel tight track-med"><h3>${title}</h3>${MORPHEMES.filter(m => m[0] === type).map(([, f, en, vi, ex]) => `<div class="morph"><b lang="en">${esc(f)}</b><span><span lang="en">${esc(en)}</span><br><span class="muted small">${esc(vi)}</span></span><span class="ex row" lang="en">${esc(ex)} ${hear(ex)}</span></div>`).join("")}</section>`;
    body = `<p class="muted" style="max-width:62ch">Phần lớn thuật ngữ y khoa ghép từ gốc Hy Lạp và La-tinh. Nhớ khoảng 30 mảnh dưới đây là đoán được nghĩa của hàng trăm từ.</p><div class="stack" style="margin-top:14px">${grp("prefix", "Tiền tố")}${grp("root", "Gốc từ")}${grp("suffix", "Hậu tố")}</div>`;
  } else {

    if (B.round >= BUILD_N) body = `<div class="panel stack track-med"><div class="row" style="gap:18px"><div class="result-num">${B.score}/${BUILD_N}</div><p class="muted">thuật ngữ ghép đúng ngay lần đầu</p></div><div><button class="btn primary" data-act="buildAgain">Luyện lượt mới</button></div></div>`;
    else {
      const t = B.order[B.round];
      body = `<div class="panel stack track-med"><div class="row between"><span class="step-kind">Thuật ngữ ${B.round + 1}/${BUILD_N}</span><span class="muted small">đúng ${B.score}</span></div>
        <p class="q" lang="en" style="font-size:22px">${esc(t.m)}</p><p class="muted">${esc(t.vi)}</p>
        <div class="tiles answer">${B.ans.map((k, i) => `<button class="tile" data-act="bOut" data-i="${i}" ${B.done ? "disabled" : ""} lang="en">${esc(B.pool[k])}</button>`).join("") || '<span class="muted small" style="padding:8px">Chạm các mảnh theo thứ tự tiền tố, gốc, hậu tố.</span>'}</div>
        <div class="tiles">${B.pool.map((p, k) => `<button class="tile ${B.ans.includes(k) ? "used" : ""}" data-act="bIn" data-k="${k}" ${B.done || B.ans.includes(k) ? "disabled" : ""} lang="en">${esc(p)}</button>`).join("")}</div>
        ${B.done ? `<div class="feedback ${B.ok ? "ok" : "no"}" role="status"><b>${B.ok ? "Đúng." : "Đáp án:"}</b> <span class="en" lang="en" style="font-size:19px">${esc(t.t)}</span> = ${t.p.map(esc).join(" + ")}</div><div class="row">${hear(t.t)}<button class="btn primary" data-act="bNext">Thuật ngữ tiếp</button></div>`
          : `<div class="row"><button class="btn" data-act="bReset">Xếp lại</button><button class="btn primary" data-act="bCheck" ${B.ans.length ? "" : "disabled"}>Kiểm tra</button></div>${B.tries ? `<div class="feedback no">Chưa đúng. Thử lại một lần.</div>` : ""}`}</div>`;
    }
  }
  return `<section class="page-head"><h1>Sổ từ và thuật ngữ</h1></section>${tabs}<div style="margin-top:18px">${body}</div>`;
}

/* ---------------- Actions ---------------- */
function curQ(qi) {
  const step = L.steps[L.i], st = stState();
  if (qi === -1) return step.t === "cloze" ? [{ opts: step.opts, a: step.a, why: step.why }, st, step.k] : [step, st, step.k];
  const skill = step.t === "listen" && st.peek ? "reading" : step.k || "vocab";
  return [step.qs[qi], st.q[qi], skill];
}
const ACT = {
  say: el => speakNow(el.dataset.text, { who: +(el.dataset.who || 0), slow: !!el.dataset.slow }),
  exitFocus() {
    stopSpeech();
    if (ROUTE.name === "lesson") location.hash = "#/path";
    else if (ROUTE.name === "review") location.hash = "#/review";
    else if (ROUTE.name === "clinic") { if (CL && CL.phase === "report") CL = null; location.hash = "#/clinic"; }
    else location.hash = "#/today";
  },
  stepNext() { stopSpeech(); if (L.i < L.steps.length - 1) { L.i++; render(true); } },
  stepBack() { stopSpeech(); if (L.i > 0) { L.i--; render(true); } },
  wordNav(el) { const st = stState(); st.wi = clamp((st.wi || 0) + +el.dataset.d, 0, L.l.words.length - 1); render(); speakNow(L.l.words[st.wi].w); },
  pick(el) {
    const qi = el.dataset.q;
    if (ROUTE.name === "clinic") { const c = CL.c; const [q, qs] = qi === "dx" ? [c.dx, CL.dx] : [c.explain, CL.ex]; pickOpt2(q, qs, +el.dataset.o); render(); return; }
    const [q, qs, skill] = curQ(+qi); pickOpt(q, qs, +el.dataset.o, skill); render();
  },
  playDialog(el) {
    const step = L.steps[L.i], keys = Object.keys(step.who);
    sayLines(step.lines.map(([spk, en]) => ({ text: en, who: keys.indexOf(spk) % 2, slow: !!el.dataset.slow })), i => { document.querySelectorAll(".line").forEach(e => e.classList.remove("speaking")); if (i >= 0) document.getElementById("ln-" + i)?.classList.add("speaking"); });
  },
  toggleScript() { const st = stState(), step = L.steps[L.i]; st.show = !st.show; if (st.show && !step.qs.every((_, i) => st.q?.[i]?.done)) st.peek = true; render(); },
  toggleVi() { const st = stState(); st.vi = !st.vi; render(); },
  checkCloze() {
    const step = L.steps[L.i], st = stState(); if (st.done) return; const v = norm($("#ans")?.value); st.val = $("#ans")?.value || ""; if (!v) return;
    const ans = step.a.map(norm);
    if (ans.includes(v)) { st.done = true; st.ok = !st.tries; }
    else if (ans.some(a => a.length > 3 && lev(a, v) <= 1)) { st.done = true; st.ok = !st.tries; st.typo = true; }
    else { st.tries = (st.tries || 0) + 1; if (st.tries >= 2) { st.done = true; st.ok = false; } }
    if (st.done) result(step.k, st.ok); render();
  },
  tileIn(el) { const st = stState(); st.ans.push(+el.dataset.k); render(); },
  tileOut(el) { const st = stState(); st.ans.splice(+el.dataset.i, 1); render(); },
  tileReset() { const st = stState(); st.ans = []; render(); },
  checkOrder() {
    const step = L.steps[L.i], st = stState(), j = step.join ?? " ";
    const ok = norm(st.ans.map(k => st.pool[k]).join(j)) === norm(step.tiles.join(j)) && st.ans.length === step.tiles.length;
    if (ok) { st.done = true; st.ok = !st.tries; } else { st.tries = (st.tries || 0) + 1; if (st.tries >= 2) { st.done = true; st.ok = false; } else st.ans = []; }
    if (st.done) { result(step.k, st.ok); if (j === " ") speakNow(step.tiles.join(" ")); }
    render();
  },
  sayStep(el) { speakNow(L.steps[L.i].s, { slow: !!el.dataset.slow }); },
  checkDict() {
    const step = L.steps[L.i], st = stState(); if (st.done) return; st.val = $("#ans")?.value || ""; if (!norm(st.val)) return;
    const d = wordDiff(step.s, st.val); st.diff = d.html;
    if (d.ok) { st.done = true; st.ok = !st.tries; } else { st.tries = (st.tries || 0) + 1; if (st.tries >= 2) { st.done = true; st.ok = false; } }
    if (st.done) result(step.k, st.ok); render();
  },
  clsPick(el) { const st = stState(); st.pick[+el.dataset.i] = +el.dataset.j; render(); },
  checkCls() {
    const step = L.steps[L.i], st = stState(); let ok = 0;
    step.items.forEach(([, a], i) => { const r = st.pick[i] === a; if (r) ok++; result(step.k, r); });
    st.done = true; st.ok = ok / step.items.length; render();
  },
  pairPlay() { const step = L.steps[L.i], st = stState(); const P = PAIRS[step.set]; speakNow(P.pairs[st.cur.p][st.cur.w]); },
  pairPick(el) {
    const step = L.steps[L.i], st = stState(); st.ans = +el.dataset.i; const ok = st.ans === st.cur.w; if (ok) st.ok++;
    result("pron", ok); const pr = S.pron[step.set] || (S.pron[step.set] = { n: 0, ok: 0 }); pr.n++; if (ok) pr.ok++; render();
  },
  pairNext() { const step = L.steps[L.i], st = stState(); st.round++; st.ans = null; st.cur = null; render(); if (st.round < PAIR_ROUNDS) { const P = PAIRS[step.set]; speakNow(P.pairs[st.cur.p][st.cur.w]); } },
  async asrSpeak() {
    const st = stState(), step = L.steps[L.i]; if (ASR.on) { try { ASR.cur.stop(); } catch { } return; }
    render(); setTimeout(render, 50);
    try { const alts = await recognize(); if (!alts.length) { asrError("no-speech"); render(); return; } st.heard = alts[0]; runSpeakCheck(step, st, alts.join(" "), "asr"); }
    catch (e) { asrError(e); }

/* ---------------- Sync (GitHub Gist) ---------------- */
const SYNC = { status: "idle", msg: "", pending: false, busy: false };
const SYNC_FILE = "tnkhoi-english-sync.json";
function syncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || "{}") || {}; } catch { return {}; } }
function saveCfg(c) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch { } }
async function gh(path, opt = {}) {
  const c = syncCfg(); if (!c.token) throw new Error("Chưa có mã truy cập GitHub.");
  const r = await fetch("https://api.github.com" + path, { method: opt.method || "GET", cache: "no-store", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + c.token, ...(opt.body ? { "Content-Type": "application/json" } : {}) }, body: opt.body });
  if (!r.ok) throw new Error({ 401: "Mã truy cập không hợp lệ hoặc đã hết hạn.", 403: "Mã truy cập thiếu quyền Gists, hoặc GitHub đang giới hạn tạm thời.", 404: "Không tìm thấy bản đồng bộ trên GitHub." }[r.status] || "GitHub báo lỗi " + r.status + ".");
  return r.status === 204 ? null : r.json();
}
function mergeState(a, b) {
  const m = JSON.parse(JSON.stringify(a));
  if ((b.settingsAt || 0) > (a.settingsAt || 0)) { m.settings = b.settings; m.settingsAt = b.settingsAt; }
  if ((b.goals.setAt || 0) > (a.goals.setAt || 0)) m.goals = b.goals;
  for (const [id, v] of Object.entries(b.lessons)) { const x = m.lessons[id]; m.lessons[id] = !x ? v : { done: x.done || v.done, best: Math.max(x.best, v.best), last: Math.max(x.last, v.last), n: Math.max(x.n, v.n) }; }
  for (const [id, c] of Object.entries(b.cards)) { const x = m.cards[id]; if (!x || (c.last || 0) > (x.last || 0)) m.cards[id] = c; }
  const seen = new Set(m.log.map(e => e.t + e.k + e.src + e.ok)); b.log.forEach(e => { const k = e.t + e.k + e.src + e.ok; if (!seen.has(k)) { seen.add(k); m.log.push(e); } }); m.log.sort((x, y) => x.t - y.t); m.log = m.log.slice(-4000);
  for (const [id, v] of Object.entries(b.cases)) { const x = m.cases[id]; m.cases[id] = !x ? v : { best: Math.max(x.best, v.best), n: Math.max(x.n, v.n), last: Math.max(x.last, v.last) }; }
  for (const [id, v] of Object.entries(b.pron)) { const x = m.pron[id]; m.pron[id] = !x || v.n > x.n ? v : x; }
  if (b.lab.n > m.lab.n) m.lab = b.lab;
  for (const [k, v] of Object.entries(b.known)) m.known[k] = m.known[k] ? Math.min(m.known[k], v) : v;
  for (const [d, v] of Object.entries(b.intake)) { const x = m.intake[d] || { gen: 0, med: 0 }; m.intake[d] = { gen: Math.max(x.gen, v.gen), med: Math.max(x.med, v.med) }; }
  for (const [dev, days] of Object.entries(b.time.byDev)) { const x = m.time.byDev[dev] || (m.time.byDev[dev] = {}); for (const [d, v] of Object.entries(days)) x[d] = Math.max(x[d] || 0, v); }
  m.time.legacy = Math.max(a.time.legacy, b.time.legacy); recomputeTime(m);
  if (b.resume && (!a.resume || (b.resume.savedAt || 0) > (a.resume.savedAt || 0))) m.resume = b.resume;
  m.createdAt = Math.min(a.createdAt, b.createdAt);
  return m;
}
function paintSync() { document.querySelectorAll(".sync-dot").forEach(el => { el.className = el.className.replace(/s-\w+/, "s-" + (syncCfg().token ? SYNC.status : "off")); el.title = syncTitle(); }); const st = document.getElementById("syncState"); if (st) st.textContent = syncTitle(); }
async function syncNow(manual) {
  const c = syncCfg(); if (!c.token || SYNC.busy) return;
  SYNC.busy = true; SYNC.status = "busy"; paintSync();
  try {
    if (!c.gistId) { const list = await gh("/gists?per_page=100"); const f = (list || []).find(g => g.files && g.files[SYNC_FILE]); if (f) { c.gistId = f.id; saveCfg(c); } }
    if (c.gistId) {
      const g = await gh("/gists/" + c.gistId); const f = g.files && g.files[SYNC_FILE];
      if (f) { let txt = f.content; if (f.truncated) txt = await (await fetch(f.raw_url, { cache: "no-store" })).text(); const remote = sanitize(JSON.parse(txt)); S = mergeState(S, remote); save(); }
    }
    const content = JSON.stringify({ ...S, updatedAt: Date.now(), syncDevice: DEV });
    const files = { [SYNC_FILE]: { content } };
    if (c.gistId) await gh("/gists/" + c.gistId, { method: "PATCH", body: JSON.stringify({ files }) });
    else { const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: "Tnkhoi English: dữ liệu học cá nhân (đừng xóa)", public: false, files }) }); c.gistId = g.id; }
    c.lastSync = Date.now(); saveCfg(c); SYNC.status = "ok"; SYNC.msg = ""; SYNC.pending = false;
    if (manual) toast("Đã đồng bộ.");
    if (!isFocus()) render(); else paintSync();
  } catch (e) { SYNC.status = "err"; SYNC.msg = e.message || "không rõ"; paintSync(); if (manual) toast(SYNC.msg); if (ROUTE.name === "sync") render(); }

function lessonsSection(u) {
  const done = u.lessons.filter(id => S.lessons[id]?.done).length;
  const core = u.core.length ? `<div class="lgroup"><div class="lg-h"><span class="ti">💬</span><span class="grow"><b>Bài giao tiếp</b><br><span class="muted small">Hội thoại, mẫu câu và lỗi sai thường gặp</span></span></div><div class="list">${u.core.map(id => lessonItem(LESSON_BY[id], "★")).join("")}</div></div>` : "";
  const groups = u.groups.map(g => { const t = LIB_BY[g.tid], d = g.ids.filter(id => S.lessons[id]?.done).length; return `<details class="lgroup" style="--tc:${t.color}" ${d < g.ids.length && g === u.groups.find(x => x.ids.some(id => !S.lessons[id]?.done)) ? "open" : ""}><summary class="lg-h"><span class="ti">${t.icon}</span><span class="grow"><b lang="en">${esc(t.title)}</b> <span class="lv lv-${g.lvl}">${lvName(g.lvl)}</span><br><span class="muted small">${esc(t.vi)}</span></span><span class="chip ${d === g.ids.length ? "good" : ""}">${d}/${g.ids.length} bài</span></summary><div class="list">${g.ids.map(id => lessonItem(LESSON_BY[id], LESSON_BY[id].part)).join("")}</div></details>`; }).join("");
  return `<section class="panel stack" style="margin-top:14px"><div class="row between"><h3>📖 Bài học <span class="muted small">${done}/${u.lessons.length} bài</span></h3>${unitWords(u).some(w => wStatus(w) === "new") ? `<button class="btn small" data-act="randLesson" data-u="${u.id}">🎲 Bài ngẫu nhiên (5 từ chưa học)</button>` : ""}</div>
    <p class="muted small">Mỗi bài dạy ${LESSON_SIZE} từ của một nhóm từ vựng trong chặng, cùng cấu trúc với các bài G và M: học từ, kiểm tra nghĩa, điền từ, từ loại, nghe hiểu, sắp xếp câu, chép chính tả, viết đúng, phát âm và nói. Học xong, các từ vào lịch ôn tập và được tính vào tiến độ của Thư viện.</p>${core}${groups}</section>`;
}
const _viewUnit43 = viewUnit;
viewUnit = function () {
  const u = UNIT_BY[ROUTE.arg]; let h = _viewUnit43(); if (!u) return h;
  const sec = lessonsSection(u), re = /<section class="panel stack" style="margin-top:14px"><h3>📖 Bài học<\/h3>[\s\S]*?<\/section>/;
  h = re.test(h) ? h.replace(re, sec) : h.replace('<section class="panel stack" style="margin-top:14px"><div class="row between"><h3>🔤', sec + '<section class="panel stack" style="margin-top:14px"><div class="row between"><h3>🔤');
  return h.replace(/Học bài (v-[\w-]+)/, (m, id) => { const l = LESSON_BY[id]; return l ? `Học bài: ${l.title} (phần ${l.part}/${l.parts})` : m; });
};

/* ---------------- Today: lesson of the current unit ---------------- */
const _plan43 = planToday;
planToday = function () {
  let items = _plan43().filter(i => i.kind !== "lesson"); const add = [];
  for (const tr of ["gen", "med"]) {
    const u = currentUnit(tr); if (!u) continue; const lid = u.lessons.find(id => !S.lessons[id]?.done); if (!lid) continue; const l = LESSON_BY[lid];
    add.push({ kind: "lesson", track: tr, short: `học bài ${l.gen ? l.title : l.id}`, title: `Bài học chặng ${u.code}: ${l.title}${l.gen ? ` (phần ${l.part}/${l.parts})` : ""}`, why: l.gen ? `${l.words.length} từ mới: ${l.words.map(w => w.w).join(", ")}.` : l.can, href: `#/lesson/${lid}`, cta: "Vào bài", est: l.min });
  }
  items = items.filter(i => !(i.kind === "intake" && add.some(a => a.track === i.track)));
  items.splice(items[0] && items[0].kind === "review" ? 1 : 0, 0, ...add);
  return items.slice(0, 4);
};

/* ---------------- Random lesson ---------------- */
Object.assign(ACT, {
  randLesson(el) {
    const u = UNIT_BY[el.dataset.u]; const fresh = shuffle(unitWords(u).filter(w => wStatus(w) === "new")).slice(0, LESSON_SIZE);
    if (fresh.length < 3) { toast("Chặng này còn quá ít từ chưa học để tạo bài ngẫu nhiên."); return; }
    const id = `r-${u.id}-${Date.now().toString(36)}`, words = fresh.map(lessonWord);
    const l = { id, gen: true, random: true, unit: u.id, topic: "", part: 1, parts: 1, track: u.track, level: u.level, min: 10, title: "Random mix", vi: `Bài ngẫu nhiên, chặng ${u.code}`, can: `Nhận biết, nghe, viết và dùng đúng ${words.length} từ: ${words.map(w => w.w).join(", ")}.`, pre: [], words, pool: unitWords(u).map(lessonWord) };
    l.steps = buildGenSteps(l, UNITS.indexOf(u), Math.floor(Math.random() * 7)); LESSON_BY[id] = l;
    location.hash = "#/lesson/" + id;
  }
});

/* ---------------- Start ---------------- */
initApp();
if (syncCfg().token && syncCfg().auto !== false) setTimeout(() => syncNow(false), 1500);

</script>
